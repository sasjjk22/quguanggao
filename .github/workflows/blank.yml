name: Build Cat Plugin Jar

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Dex Jar
        run: .\gradlew.bat jar

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-plugin-jar
          path: build/libs/*_Dex_4K_Aligned.jar
