name: Screen Sources and Build Clean Sub

on:
  workflow_dispatch:
  push:
    paths:
      - 'screen_sources.py'
      - '.github/workflows/screen_sources.yml'

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install curl_cffi
        run: pip install curl_cffi || true

      - name: Run Source Screener
        run: python3 screen_sources.py

      - name: Commit Report and Subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_cat_sources.json my_sources.json sources_report.md src/main/kotlin/BuiltinSources.kt
          git diff --cached --quiet || git commit -m "chore: update cat and tvbox subscriptions"
          git push
